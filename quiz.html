
<!DOCTYPE html>
<html>
<head>
    <title>Quiz Questions</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>QuizMaster</h1>

    <h3>{{ subject }}</h3>

    <p>Question {{ number }} of {{ total }}</p>

    <h2>{{ question.question }}</h2>

    <form method="POST">

        {% for option in question.options %}

        <label class="option">
            <input type="radio"
                   name="answer"
                   value="{{ option }}"
                   required>
            {{ option }}
        </label>

        {% endfor %}

        <button type="submit">
            {% if number == total %}
                Submit Quiz
            {% else %}
                Next Question
            {% endif %}
        </button>

    </form>

</div>

</body>
</html>
